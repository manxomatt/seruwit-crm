; Supervisor config — Laravel queue worker + scheduler (Seruwit CRM)
;
; Install:
;   sudo cp docs/deploy/seruwit-crm-worker.conf /etc/supervisor/conf.d/seruwit-crm-worker.conf
;   # Edit directory=, command=, user=, and logfile paths below to match the server.
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start seruwit-crm-worker:*
;   sudo supervisorctl start seruwit-crm-scheduler
;   sudo supervisorctl status
;
; After each deploy (so workers pick up new code):
;   php artisan queue:restart
;   sudo supervisorctl restart seruwit-crm-scheduler
;   # or: sudo supervisorctl restart seruwit-crm-worker:* seruwit-crm-scheduler
;
; Useful commands:
;   sudo supervisorctl stop seruwit-crm-worker:*
;   sudo supervisorctl stop seruwit-crm-scheduler
;   sudo supervisorctl tail -f seruwit-crm-worker:seruwit-crm-worker_00
;   sudo supervisorctl tail -f seruwit-crm-scheduler

[program:seruwit-crm-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/seruwit.com
command=php /var/www/seruwit.com/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=300
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/seruwit.com/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:seruwit-crm-scheduler]
process_name=%(program_name)s
directory=/var/www/seruwit.com
command=php /var/www/seruwit.com/artisan schedule:work
autostart=true
autorestart=true
startsecs=1
startretries=3
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/seruwit.com/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=10
